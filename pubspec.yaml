name: tracks
description: Flutter client for Tracks
version: 1.0.0
publish_to: none

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  collection: ^1.19.1
  dynamic_color: ^2.1.0
  flutter:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_riverpod: ^3.4.3
  html: ^0.15.6
  http: ^1.2.1
  intl: ^0.20.2
  json_annotation: ^4.9.0
  json_serializable: ^6.8.0
  riverpod_annotation: ^4.0.7
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^4.0.9

flutter:
  uses-material-design: true
  assets:
    - assets/stations.json

flutter_launcher_icons:
  android: true
  image_path: assets/icon/icon.png
  adaptive_icon_foreground: assets/icon/adaptive.png
  adaptive_icon_background: '#f13c58'
  adaptive_icon_monochrome: assets/icon/monochrome.png
  web:
    generate: true
    image_path: assets/icon/web.png
